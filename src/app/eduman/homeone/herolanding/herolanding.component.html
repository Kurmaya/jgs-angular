<section class="slider-area hero-height position-relative fix vHeroBg" [style.background-image]="'url(assets/img/whatsinaname/admissionsNewBanner2023.jpg)'">

    <div class="container vPosRelative">
       <div class="row">
          <div class="col-xl-6 col-lg-6 col-md-6">

          </div>

    <div class="vScrollDown1">

    <div class="vDeskNo" id="form">
