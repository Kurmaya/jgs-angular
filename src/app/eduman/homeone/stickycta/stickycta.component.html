<!-- Spacer so the bar never covers the end of the page -->
<div class="sticky-cta-spacer" aria-hidden="true"></div>
<nav class="sticky-cta" aria-label="Contact the admissions team">
  <a [href]="'tel:' + phone" (click)="tracking.contactClicked('call')">Call</a>
  <a [href]="whatsappHref"
     target="_blank" rel="noopener" (click)="tracking.contactClicked('whatsapp')">WhatsApp</a>
  <a class="sticky-cta-primary" [routerLink]="[]" fragment="enquire">Enquire</a>
</nav>
