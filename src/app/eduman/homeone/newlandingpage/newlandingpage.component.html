<!--
  /home: Google Ads landing page (website change brief, Section 7, items A2 to A9).
  Renders straight away (no loading spinner) and keeps only the sections a parent
  arriving from an ad needs, with the enquiry form on the first screen.
-->
<main>
    <app-landingheader></app-landingheader>
    <app-newlandinghero></app-newlandinghero>       <!-- A3, A6: hero with the form on the page -->
    <app-homewhy></app-homewhy>                     <!-- Why families choose JGS (C6) -->
    <app-homeadmissions [showForm]="false"></app-homeadmissions> <!-- Admissions steps and documents (C9) -->
    <app-testimonialslider></app-testimonialslider> <!-- Parent testimonials (C10) -->
    <app-facilitiesslider></app-facilitiesslider>   <!-- Facilities -->
    <app-galleryhome></app-galleryhome>             <!-- Campus photos -->
    <app-homefaq></app-homefaq>                     <!-- FAQ (C11) -->
    <app-landingfooter></app-landingfooter>
    <app-stickycta></app-stickycta>                 <!-- A3: Call | WhatsApp | Enquire bar on phones -->
</main>
