<section id="safety" class="home-section home-safety pt-60 pb-40">
  <div class="container">
    <div class="section-title text-center mb-40">
      <h2>Your child's <span class="down-mark-line">safety</span> comes first</h2>
    </div>
    <div class="row">
      <div class="col-md-6 col-lg-4 mb-30" *ngFor="let item of items">
        <div class="home-card home-safety-card">
          <h3>{{ item.title }}</h3>
          <p>{{ item.text }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
