<div class="container pb-40">
    <div class="row">
        <div class="col-xl-12 pt-40">
            <div class="section-title text-center mb-40">
                <h2>
                    <span class="down-mark-line">Gallery</span>
                </h2>
                <p>World of JGS</p>
            </div>
        </div>
        <div *ngFor="let data of data; let i=index" class="col-lg-4 col-md-6">
            <div class="vWrapper">
                <div class="vImageList">
                    <img (click)="onPreviewImage(i)" [src]="data.imageSrc" class="img-fluid" [alt]="data.imageAlt" />
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="showMask" class="lightbox" animation2>
        <span *ngIf="showCount" class="count">{{currentIndex + 1}}/{{totalImageCount}}</span>
        <button *ngIf="previewImage" class="close-btn" (click)="onClosePreview()">
            <i class="fa fa-times" aria-hidden="true"></i>
        </button>
        <button *ngIf="controls" class="pre-btn" (click)="prev()">
            <i class="fa fa-arrow-left" aria-hidden="true"></i>
        </button>
        <button *ngIf="controls" class="next-btn" (click)="next()">
            <i class="fa fa-arrow-right" aria-hidden="true"></i>
        </button>
        <div *ngIf="previewImage" [@animation]="{value: 'visible'}" (@animation.done)="onAnimationEnd($event)" class="lightbox-img">
            <img [src]="currentLightBoxImage.imageSrc" [alt]="currentLightBoxImage.imageAlt" />
        </div>
    </div>
</div>
