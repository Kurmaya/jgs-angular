
 <!-- side toggle start -->
 <div class="fix">
    <div class="side-info" [class.opened]="sidebarInfoActive">
       <div class="side-info-content">
          <div class="offset-widget offset-logo mb-40">
             <div class="row align-items-center">
                <div class="col-9">
                   <a [routerLink]="['/']">
                      <img src="assets/img/whatsinaname/JGSNewwLogo.png" alt="Logo" class="img-fluid">
                   </a>
                   
                </div>
                <div class="col-3 text-end"><button class="side-info-close" (click)="infoclick()"><i class="fal fa-times"></i></button>
                </div>
             </div>
          </div>

          <app-landingmobilemenu></app-landingmobilemenu>
       </div>
    </div>
 </div>
 <div class="offcanvas-overlay" [class.open-signin]="signInActive" (click)="signinclick()"></div>
 <div class="offcanvas-overlay" [class.open-signup]="signUpActive"  (click)="signupclick()"></div>
 <div class="offcanvas-overlay-white"></div>
 <!-- side toggle end -->




 <!-- header-area-start  -->
 <header>
    <div class="header-area header-transparent sticky-header" [ngClass]="{'mat-elevation-z5' : true, 'sticky' : isSticky}">
       <div class="container-fluid">
          <div class="header-main-wrapper fl">
             <div class="row align-items-center">
                <div class="col-xl-12 col-lg-9 col-md-9 col-sm-9 col-9">
                   <div class="header-left d-flex align-items-center justify-content-between">
                      <div class="header-logo">
                         <a [routerLink]="['/']"><img src="assets/img/whatsinaname/mokila logo.png" alt="Johnson Grammar School Kokapet and Mokila"></a>
                      </div>
                      
                      <div class="main-menu d-none d-xl-block">
                        <nav id="mobile-menu">
                           <ul>
                             
                              <li><a href="tel:+919513251488" class="cta-btn" (click)="tracking.contactClicked('call')">Call Now</a></li>
                             
                           </ul>
                        </nav>
                     </div>
                   </div>
                </div>
                <div class="col-xl-5 col-lg-3 col-md-3 col-sm-3 col-3">
                  <!-- Hidden on phones, where the sticky Call | WhatsApp | Enquire bar is shown instead. -->
                  <a href="tel:+919513251488" class="cta-btn mob landing-header-call" (click)="tracking.contactClicked('call')">Call Now</a>
                  
                </div>
             </div>
          </div>
       </div>
    </div>
 </header>
 <!-- header-area-end -->
